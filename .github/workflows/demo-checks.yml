name: Validar demo interactiva

on:
  push:
    branches: [main, feature/demo-v2-editorial]
    paths:
      - "docs/**"
      - "scripts/check-demo.mjs"
      - ".github/workflows/demo-checks.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis JavaScript
        run: node --check docs/app.js
      - name: Probar navegación y funcionalidades
        run: node scripts/check-demo.mjs
